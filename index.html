<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aminul Islam Siyam - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="decor-bar-left"></div>

 

  <div class="main-wrapper">
    <section class="hero-section">
      <!-- Left Column -->
      <div class="left-content">
        <div class="hello-container">
          <h1 class="hello-text">HELLO!</h1>
          <div class="hello-underline"></div>
        </div>

        <div class="name-title">
          <div class="outline-text">I'M AMINUL ISLAM</div>
          <div class="outline-text highlight">SIYAM</div>
        </div>

        <div class="badge">
          <span>FULL-STACK DEVELOPER</span>
          <span class="dot">•</span>
          <span>CREATIVE DESIGNER</span>
          <span class="dot">•</span>
          <span>NEWS WRITER</span>
        </div>

        <p class="description">
          A passionate Software Developer and Creative Designer, currently seeking software development internships and freelance design opportunities to learn, create, and grow.
        </p>

        <!-- Image-Only Action Buttons -->
        <div class="cta-buttons">
          <a href="#" class="btn-cv-img">
            <img src="images/cv-button.png" alt="CV / Resume" class="btn-full-img">
          </a>
          <a href="contact.html" class="btn-talk-img">
            <img src="images/talk-button.png" alt="Let's Talk" class="btn-full-img">
          </a>
        </div>
      </div>

      <!-- Right Column: Profile & Curved Orbit Navigation -->
      <div class="right-content">
        <div class="profile-wrapper">
          <div class="profile-circle">
            <img src="images/image.png" alt="Aminul Islam Siyam" class="profile-img">
          </div>

          <svg class="curved-arc" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 250,20 A 230,230 0 0,1 250,480" stroke="#F8AB1D" stroke-width="2.5" fill="none" />
            <circle cx="250" cy="20" r="6" fill="#F8AB1D" />
            <circle cx="250" cy="480" r="6" fill="#F8AB1D" />
          </svg>

          <nav class="orbit-nav">
            <a href="home.html" class="nav-item pos-1" title="Home"><img src="images/home.png" alt="Home"></a>
            <a href="about.html" class="nav-item pos-2" title="About"><img src="images/about.png" alt="About"></a>
            <a href="experience.html" class="nav-item pos-3" title="Experience"><img src="images/experience.png" alt="Experience"></a>
            <a href="project.html" class="nav-item pos-4" title="Projects"><img src="images/portfolio.png" alt="Projects"></a>
            <a href="achivement.html" class="nav-item pos-5" title="Achievements"><img src="images/achivement.png" alt="Achievements"></a>
            <a href="artice.html" class="nav-item pos-6" title="Articles"><img src="images/articles.png" alt="Articles"></a>
            <a href="contact.html" class="nav-item pos-7" title="Contact"><img src="images/contact.png" alt="Contact"></a>
          </nav>
        </div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
